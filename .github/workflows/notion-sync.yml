name: Notion Task Sync

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read

jobs:
  sync-notion:
    name: Validate and Sync to Notion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run unit tests
        run: |
          python3 -m unittest discover tests -v

      - name: Run Notion synchronization script
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .github/scripts/sync_notion.py
